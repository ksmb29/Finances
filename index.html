<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inversiones">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .icon-btn {
            width: 2.75rem;
            height: 2.75rem;
            padding: 0;
            border-radius: 9999px;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h1 {
            font-size: 2.25rem;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: #94a3b8;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: #334155;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #334155;
        }

        .tabs .tab {
            flex: 1;
            text-align: center;
        }

        .tab {
            background: transparent;
            border: none;
            border-radius: 0.5rem 0.5rem 0 0;
            padding: 0.75rem 0.5rem;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tab:hover {
            background: #1e293b;
            color: #fff;
        }

        .tab.active {
            color: #10b981;
            border-bottom: 2px solid #10b981;
            background: transparent;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .stat-box {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .stat-box p {
            color: #d1fae5;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-box .amount {
            font-size: 1.75rem;
            font-weight: bold;
            color: #fff;
        }

        .stat-box.blue {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .stat-box.blue p {
            color: #dbeafe;
        }

        .stat-box.purple {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
        }

        .stat-box.purple p {
            color: #f3e8ff;
        }

        .stat-box.slate {
            background: linear-gradient(135deg, #64748b 0%, #334155 100%);
        }

        .stat-box.slate p {
            color: #e2e8f0;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .mini-stat {
            background: #334155;
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
        }

        .mini-stat.compact {
            padding: 0.6rem 0.5rem;
        }

        .mini-stat.compact p {
            font-size: 0.68rem;
            margin-bottom: 0.25rem;
        }

        .mini-stat.compact .value {
            font-size: 0.85rem;
        }

        .grid-compact {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem;
        }

        .mini-stat p {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .mini-stat .value {
            font-weight: bold;
            font-size: 1rem;
        }

        .update-section {
            margin-bottom: 2rem;
        }

        .update-section h3 {
            font-size: 1.125rem;
            margin-bottom: 0.25rem;
        }

        .update-section .hint {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        label.field-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.875rem;
        }

        input, select {
            background: #334155;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            padding: 0.75rem;
            color: #fff;
            font-size: 1rem;
            width: 100%;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1);
        }

        .item-list {
            max-height: 480px;
            overflow-y: auto;
        }

        .item-row {
            background: #334155;
            border: 1px solid #475569;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
            display: grid;
            gap: 1rem;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .item-name {
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .item-meta {
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .badge {
            background: #064e3b;
            color: #86efac;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge.warning {
            background: #451a03;
            color: #fdba74;
        }

        .badge.danger {
            background: #450a0a;
            color: #fca5a5;
        }

        .badge.muted {
            background: #1e293b;
            color: #94a3b8;
        }

        .item-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            font-size: 0.875rem;
        }

        .item-data-item p {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .item-data-item .value {
            font-weight: bold;
            font-size: 1rem;
        }

        .progress-wrap {
            margin-top: 0.25rem;
        }

        .progress-wrap .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        .progress-track {
            background: #1e293b;
            border-radius: 9999px;
            height: 0.6rem;
            overflow: hidden;
            border: 1px solid #475569;
        }

        .progress-fill {
            height: 100%;
            border-radius: 9999px;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            transition: width 0.3s ease;
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, #f97316, #f59e0b);
        }

        .progress-fill.danger {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        /* ---- Registrar Gasto: estilo minimalista tipo Apple ---- */
        .expense-card {
            background: linear-gradient(160deg, #1e293b 0%, #172033 100%);
            border: 1px solid #334155;
            border-radius: 1.25rem;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .amount-input-wrap {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.25rem;
            margin-bottom: 1.75rem;
        }

        .amount-input-wrap .currency-symbol {
            font-size: 1.75rem;
            color: #64748b;
            font-weight: 600;
        }

        .amount-input {
            background: transparent !important;
            border: none !important;
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            width: auto;
            max-width: 260px;
            padding: 0 !important;
            color: #fff;
            -moz-appearance: textfield;
        }

        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .amount-input:focus {
            box-shadow: none !important;
        }

        .desc-input {
            background: #0f172a !important;
            border: none !important;
            border-radius: 0.75rem !important;
            text-align: center;
            font-size: 1rem;
            padding: 0.85rem !important;
            margin-bottom: 1.25rem;
        }

        .pill-row {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
            margin-bottom: 1rem;
            -webkit-overflow-scrolling: touch;
        }

        .pill {
            flex-shrink: 0;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 9999px;
            padding: 0.55rem 1.1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .pill:hover {
            border-color: #475569;
        }

        .pill.active {
            background: #10b981;
            border-color: #10b981;
            color: #fff;
        }

        .pill.active.tarjeta-active {
            background: #f97316;
            border-color: #f97316;
        }

        .expense-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .date-chip {
            background: #0f172a !important;
            border: 1px solid #334155 !important;
            border-radius: 0.75rem !important;
            padding: 0.65rem 1rem !important;
            font-size: 0.85rem !important;
            width: auto !important;
            color: #94a3b8 !important;
            flex-grow: 1;
        }

        .fab-add {
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            font-size: 2rem;
            line-height: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
            flex-shrink: 0;
        }

        .expense-hint-tarjeta {
            text-align: center;
            margin-top: 0.75rem;
        }

        .smart-move-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed #10b981;
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            margin-top: 0.75rem;
        }

        .smart-move-box .smart-move-title {
            font-size: 0.75rem;
            color: #6ee7b7;
            font-weight: 600;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .smart-move-box .smart-move-amount {
            font-size: 1.1rem;
            font-weight: 700;
            color: #10b981;
        }

        .smart-move-box .smart-move-detail {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        .value.primary { color: #10b981; }
        .value.blue { color: #3b82f6; }
        .value.orange { color: #f97316; }
        .value.purple { color: #a855f7; }

        button {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #059669;
        }

        button.danger {
            background: #ef4444;
        }

        button.danger:hover {
            background: #dc2626;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .empty {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }

        .section-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 2000;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const PLATAFORMAS = ['Rappi', 'Banco de Bogotá'];
        const CASHBACK_TARJETAS = { 'Rappi': 1, 'Banco de Bogotá': 5 };

        const DIAS_GRACIA_DEFAULT = 12;
        const UMBRAL_SMMLV = 7800000; // referencia para no superar el tope y evitar GMF/retención
        const CATEGORIAS_GASTOS = ['Mercado', 'Transporte', 'Ocio', 'Servicios', 'Salidas Familia', 'Hogar', 'Comida', 'Regalos', 'Otros'];

        function App() {
            const [cdts, setCdts] = useState(() => {
                const saved = localStorage.getItem('cdts');
                return saved ? JSON.parse(saved) : [];
            });

            const [cuentas, setCuentas] = useState(() => {
                const saved = localStorage.getItem('cuentas');
                return saved ? JSON.parse(saved) : [];
            });

            const [fondos, setFondos] = useState(() => {
                const saved = localStorage.getItem('fondos');
                if (saved) return JSON.parse(saved);
                // migración desde versión anterior (fpvPension)
                const legacy = localStorage.getItem('fpvPension');
                if (legacy) {
                    const l = JSON.parse(legacy);
                    return { fpv: l.fpv || 0, pensionObligatoria: l.pension || 0, cesantias: l.cesantias || 0 };
                }
                return { fpv: 0, pensionObligatoria: 0, cesantias: 0 };
            });

            const [fondosFecha, setFondosFecha] = useState(() => localStorage.getItem('fondosFecha') || '');

            const [deudas, setDeudas] = useState(() => {
                const saved = localStorage.getItem('deudasTC');
                return saved ? JSON.parse(saved) : [];
            });

            const [otrosActivos, setOtrosActivos] = useState(() => {
                const saved = localStorage.getItem('otrosActivos');
                return saved ? JSON.parse(saved) : [];
            });

            const [historial, setHistorial] = useState(() => {
                const saved = localStorage.getItem('historialRendimiento');
                let data = saved ? JSON.parse(saved) : [];
                // Eliminar registro del 31/08/2026
                data = data.filter(h => h.fecha !== '2026-08-31');
                return data;
            });

            const [historialMensual, setHistorialMensual] = useState(() => {

                return saved ? JSON.parse(saved) : [];
            });

            const [gastos, setGastos] = useState(() => {

                if (saved) {

                // Gastos de Septiembre 2026 extraídos del Gmail

            const [trm, setTrm] = useState(() => localStorage.getItem('trmManual') || '');

            const [hideAmounts, setHideAmounts] = useState(() => localStorage.getItem('hideAmounts') === 'true');

            const [tab, setTab] = useState('home');

            const [showOtroModal, setShowOtroModal] = useState(false);

            const [editingOtroId, setEditingOtroId] = useState(null);
            const [toast, setToast] = useState('');
            const [searchGasto, setSearchGasto] = useState('');
            const [editingGastoId, setEditingGastoId] = useState(null);
            const [showGastoModal, setShowGastoModal] = useState(false);
            const [lastBackupDate, setLastBackupDate] = useState(() => localStorage.getItem('lastBackupDate') || '');
            
            const [tarjetas, setTarjetas] = useState(() => {
                const saved = localStorage.getItem('tarjetas');
                return saved ? JSON.parse(saved) : [];
            });

            // Auto-populate tarjetas con cashback por defecto (fusiona por nombre, no borra lo existente)

                const valorCuota = Number(montoTotal) / cuotas;

                const cuotasRestantes = cuotas - pagadas;
                return { valorCuota, saldoPendiente, cuotasRestantes };

            const calcularGananciaCuotas = (montoTotal, cuotasTotales, tasaAnual) => {

                        aplicaCashback: gastoForm.aplicaCashback,
                        cashbackMonto,
                        categoria: gastoForm.categoria
                    }]);
                    showToast('Gasto registrado en Deudas TC');
                } else {
                    setGastos([...gastos, {
                        id: Date.now(),
                        descripcion: gastoForm.descripcion,
                        monto,
                        metodo: 'efectivo',
                        fecha: gastoForm.fecha,
                        categoria: gastoForm.categoria
                    }]);
                    showToast('Gasto en efectivo registrado');
                }
                setGastoForm(getEmptyGastoForm());
            };

            const handleEditGasto = (gasto) => {
                setGastoForm(gasto);
                setEditingGastoId(gasto.id);
                setShowGastoModal(true);
            };

            const handleUpdateGasto = () => {
                if (!gastoForm.descripcion || !gastoForm.monto) {
                    showToast('Completa descripción y monto');
                    return;
                }

                setGastos(gastos.map(g => g.id === editingGastoId ? { ...gastoForm, id: editingGastoId } : g));
                setEditingGastoId(null);
                setShowGastoModal(false);
                setGastoForm(getEmptyGastoForm());
                showToast('Gasto actualizado');
            };

            const handleDeleteGasto = (id) => {
                const gasto = gastos.find(g => g.id === id);
                if (!gasto) return;
                if (!confirm('¿Eliminar este gasto? Si fue pagado desde tu cuenta principal, se le devolverá el monto.')) return;

                if (gasto.metodo === 'cuenta' && gasto.cuentaId) {
                    setCuentas(cuentas.map(c => c.id === Number(gasto.cuentaId)
                        ? { ...c, saldo: Number(c.saldo || 0) + Number(gasto.monto) }
                        : c));
                } else if (gasto.metodo === 'tarjeta' && gasto.deudaId) {
                    setDeudas(deudas.filter(d => d.id !== gasto.deudaId));
                }
                setGastos(gastos.filter(g => g.id !== id));
                showToast('Gasto eliminado');
            };

            const handleSaveFondos = () => {
                setFondosFecha(new Date().toISOString());
                showToast('Patrimonio del mes guardado');
            };

            // ---------- Totales ----------
            const totalCdtsSaldo = useMemo(() => cdts.reduce((acc, cdt) => {
                const { saldoActual } = calcularInteres(Number(cdt.principal), Number(cdt.tasa), cdt.fechaCreacion);
                return acc + saldoActual;
            }, 0), [cdts]);

            const totalCdtsInteres = useMemo(() => cdts.reduce((acc, cdt) => {
                const { interesTotal } = calcularInteres(Number(cdt.principal), Number(cdt.tasa), cdt.fechaCreacion);
                return acc + interesTotal;
            }, 0), [cdts]);

            const totalCdtsPrincipal = useMemo(() => cdts.reduce((acc, cdt) => acc + Number(cdt.principal), 0), [cdts]);

            const totalCuentas = useMemo(() => cuentas.reduce((acc, c) => acc + Number(c.saldo || 0), 0), [cuentas]);

            // Sección 1: CDTs (con interés diario acumulado) + cuentas de alto rendimiento
            const totalSeccion1 = totalCdtsSaldo + totalCuentas;

            const totalDeudaTC = useMemo(() => deudas.reduce((acc, d) => {
                const { saldoPendiente } = calcularDeuda(d.montoTotal, d.cuotasTotales, d.cuotasPagadas);
                return acc + saldoPendiente;
            }, 0), [deudas]);

            // Otros activos, agrupados por moneda (no se mezclan tasas de cambio)
            const totalesOtrosPorMoneda = useMemo(() => {
                const totales = {};
                otrosActivos.forEach(o => {
                    const moneda = o.moneda || 'COP';
                    totales[moneda] = (totales[moneda] || 0) + Number(o.monto || 0);
                });
                return totales;
            }, [otrosActivos]);

            // Otros activos convertidos a COP usando la TRM que tú mismo ingresas (sin internet)
            const totalOtrosEnCOP = useMemo(() => {
                let total = 0;
                Object.entries(totalesOtrosPorMoneda).forEach(([moneda, monto]) => {
                    if (moneda === 'COP') {
                        total += monto;
                    } else if (moneda === 'USD') {
                        total += monto * Number(trm || 0);
                    }
                    // otras monedas: no se convierten (aún no soportado), no se suman al total
                });
                return total;
            }, [totalesOtrosPorMoneda, trm]);

            const hayUsdSinTrm = Number(totalesOtrosPorMoneda.USD || 0) > 0 && !Number(trm);

            // Sección 2 (Total): Sección 1 + FPV + cesantías + pensión obligatoria + otros activos (convertidos a COP) - deuda TC
            const totalSeccion2 = totalSeccion1
                + Number(fondos.fpv || 0)
                + Number(fondos.cesantias || 0)
                + Number(fondos.pensionObligatoria || 0)
                + totalOtrosEnCOP
                - totalDeudaTC;

            // Gastos diarios: totales de hoy y del mes en curso
            const gastosOrdenados = useMemo(() =>
                [...gastos].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)),
                [gastos]);

            const getHoyStr = () => {
                const hoy = new Date();
                const year = hoy.getFullYear();
                const month = String(hoy.getMonth() + 1).padStart(2, '0');
                const day = String(hoy.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };
            const hoyStr = getHoyStr();
            const mesActualStr = hoyStr.slice(0, 7);

            const totalGastadoHoy = useMemo(() =>
                gastos.filter(g => g.fecha === hoyStr).reduce((acc, g) => acc + Number(g.monto || 0), 0),
                [gastos, hoyStr]);

            const totalGastadoMes = useMemo(() =>
                gastos.filter(g => (g.fecha || '').startsWith(mesActualStr)).reduce((acc, g) => acc + Number(g.monto || 0), 0),
                [gastos, mesActualStr]);

            const cuentaFavorita = useMemo(() =>
                cuentas.find(c => String(c.id) === String(cuentaFavoritaId)) || null,
                [cuentas, cuentaFavoritaId]);

            // Tasa de rendimiento promedio ponderada: CDTs + Cuentas de Alto Rendimiento (solo ítems con tasa registrada)
            // Tasa promedio ponderada (CDTs + Cuentas):
            // Suma (monto × tasa) de cada activo / Suma montos = tasa promedio real según cuánta plata gana a cada tasa
            const tasaPromedioPonderada = useMemo(() => {
                let sumaGananciaAnual = 0;
                let sumaMontos = 0;
                cdts.forEach(c => {
                    const monto = Number(c.principal || 0);
                    const tasa = Number(c.tasa || 0);
                    if (monto > 0 && c.tasa !== '' && c.tasa !== undefined) {
                        sumaGananciaAnual += monto * tasa;
                        sumaMontos += monto;
                    }
                });
                cuentas.forEach(c => {
                    const monto = Number(c.saldo || 0);
                    const tasa = Number(c.tasa || 0);
                    if (monto > 0 && c.tasa !== '' && c.tasa !== undefined && c.tasa !== null) {
                        sumaGananciaAnual += monto * tasa;
                        sumaMontos += monto;
                    }
                });
                return sumaMontos > 0 ? sumaGananciaAnual / sumaMontos : null;
            }, [cdts, cuentas]);

            // Tasa promedio ponderada solo de CDTs
            const tasaPromedioCdts = useMemo(() => {
                let sumaGananciaAnual = 0;
                let sumaMontos = 0;
                cdts.forEach(c => {
                    const monto = Number(c.principal || 0);
                    const tasa = Number(c.tasa || 0);
                    if (monto > 0 && c.tasa !== '' && c.tasa !== undefined) {
                        sumaGananciaAnual += monto * tasa;
                        sumaMontos += monto;
                    }
                });
                return sumaMontos > 0 ? sumaGananciaAnual / sumaMontos : null;
            }, [cdts]);

            // Tasa promedio ponderada solo de cuentas (solo las que tienen tasa registrada)
            const tasaPromedioCuentas = useMemo(() => {
                let sumaGananciaAnual = 0;
                let sumaMontos = 0;
                cuentas.forEach(c => {
                    const monto = Number(c.saldo || 0);
                    const tasa = Number(c.tasa || 0);
                    if (monto > 0 && c.tasa !== '' && c.tasa !== undefined && c.tasa !== null) {
                        sumaGananciaAnual += monto * tasa;
                        sumaMontos += monto;
                    }
                });
                return sumaMontos > 0 ? sumaGananciaAnual / sumaMontos : null;
            }, [cuentas]);

            // Rendimiento diario estimado: (CDTs + Cuentas, con montos actualizados) x tasa promedio ponderada / 365
            const rendimientoDiarioEstimado = useMemo(() => {
                if (tasaPromedioPonderada === null) return null;
                const baseActualizada = totalCdtsSaldo + totalCuentas;
                return (baseActualizada * (tasaPromedioPonderada / 100)) / 365;
            }, [tasaPromedioPonderada, totalCdtsSaldo, totalCuentas]);

            // Historial de rendimiento: registra un snapshot diario del Líquido (Sección 1: CDTs + Cuentas)
            // El Total (Sección 2) no se trackea a diario porque solo cambia cuando actualizas FPV/Pensión/Cesantías/Otros a mano;
            // su evolución real se mide mes a mes en historialMensual.
            useEffect(() => {
                const hoy = new Date().toISOString().slice(0, 10);
                setHistorial(prev => {
                    const nuevo = [...prev];
                    if (nuevo.length && nuevo[nuevo.length - 1].fecha === hoy) {
                        if (nuevo[nuevo.length - 1].total === totalSeccion1) return prev;
                        nuevo[nuevo.length - 1] = { fecha: hoy, total: totalSeccion1 };
                    } else {
                        nuevo.push({ fecha: hoy, total: totalSeccion1 });
                    }
                    return nuevo.slice(-90);
                });
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [totalSeccion1]);

            const historialOrdenado = useMemo(() =>
                [...historial].sort((a, b) => new Date(a.fecha) - new Date(b.fecha)),
                [historial]);

            const variacionDiaria = useMemo(() => {
                if (historialOrdenado.length < 2) return null;
                const hoy = historialOrdenado[historialOrdenado.length - 1];
                const ayer = historialOrdenado[historialOrdenado.length - 2];
                const diferencia = hoy.total - ayer.total;
                const porcentaje = ayer.total !== 0 ? (diferencia / ayer.total) * 100 : 0;
                return { diferencia, porcentaje };
            }, [historialOrdenado]);

            const ultimos7Dias = useMemo(() => historialOrdenado.slice(-7), [historialOrdenado]);

            const variacion7Dias = useMemo(() => {
                if (ultimos7Dias.length < 2) return null;
                const primero = ultimos7Dias[0];
                const ultimo = ultimos7Dias[ultimos7Dias.length - 1];
                const diferencia = ultimo.total - primero.total;
                const porcentaje = primero.total !== 0 ? (diferencia / primero.total) * 100 : 0;
                return { diferencia, porcentaje };
            }, [ultimos7Dias]);

            const variacionMensual = useMemo(() => {
                if (historialMensual.length < 2) return null;
                const actual = historialMensual[historialMensual.length - 1];
                const anterior = historialMensual[historialMensual.length - 2];
                const diferenciaLiquido = actual.liquido - anterior.liquido;
                const porcentajeLiquido = anterior.liquido !== 0 ? (diferenciaLiquido / anterior.liquido) * 100 : 0;
                const diferenciaTotal = actual.total - anterior.total;
                const porcentajeTotal = anterior.total !== 0 ? (diferenciaTotal / anterior.total) * 100 : 0;
                return { diferenciaLiquido, porcentajeLiquido, diferenciaTotal, porcentajeTotal };
            }, [historialMensual]);

            const cdtsOrdenados = useMemo(() =>
                [...cdts].sort((a, b) => new Date(a.fechaVencimiento) - new Date(b.fechaVencimiento)),
                [cdts]);

            const formatCurrency = (num, moneda = 'COP') => {
                if (hideAmounts) return '••••••';
                return new Intl.NumberFormat('es-CO', { style: 'currency', currency: moneda, minimumFractionDigits: 0 }).format(num || 0);
            };

            const formatDate = (date) => {
                if (!date) return '—';
                const [year, month, day] = date.split('-');
                return new Date(year, month - 1, day).toLocaleDateString('es-CO');
            };

            const calcularVencimientoTC = (diaCorte, diasGracia) => {
                const hoy = new Date();
                const año = hoy.getFullYear();
                const mes = hoy.getMonth();
                
                // Crear fecha de corte de este mes
                let fechaCorte = new Date(año, mes, diaCorte);
                
                // Si el corte ya pasó, usar el próximo mes
                if (fechaCorte < hoy) {
                    fechaCorte = new Date(año, mes + 1, diaCorte);
                }
                
                // Agregar días de gracia
                let fechaVencimiento = new Date(fechaCorte);
                fechaVencimiento.setDate(fechaVencimiento.getDate() + diasGracia);
                
                // Ajustar si cae en fin de semana o festivo
                const festivos = [
                    new Date(año, 0, 1), // Año Nuevo
                    new Date(año, 4, 1), // Día del Trabajo
                    new Date(año, 6, 20), // Independencia
                    new Date(año, 7, 7), // Batalla de Boyacá
                    new Date(año, 11, 25), // Navidad
                ];
                
                while (fechaVencimiento.getDay() === 0 || fechaVencimiento.getDay() === 6 || 
                       festivos.some(f => f.toDateString() === fechaVencimiento.toDateString())) {
                    // Si es fin de semana o festivo, pasar al lunes siguiente
                    if (fechaVencimiento.getDay() === 0 || fechaVencimiento.getDay() === 6) {
                        const diasAlunes = (1 - fechaVencimiento.getDay() + 7) % 7 || 1;
                        fechaVencimiento.setDate(fechaVencimiento.getDate() + diasAlunes);
                    } else {
                        fechaVencimiento.setDate(fechaVencimiento.getDate() + 1);
                    }
                }
                
                const year = fechaVencimiento.getFullYear();
                const month = String(fechaVencimiento.getMonth() + 1).padStart(2, '0');
                const day = String(fechaVencimiento.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const calcularSemaforoTC = (fechaLimite) => {
                const hoy = new Date();
                const [year, month, day] = fechaLimite.split('-');
                const fecha = new Date(year, month - 1, day);
                const diasRestantes = Math.ceil((fecha - hoy) / (1000 * 60 * 60 * 24));
                
                if (diasRestantes <= 3) return { color: '#8b0000', label: 'CRÍTICO', dias: diasRestantes };
                if (diasRestantes <= 15) return { color: '#ef4444', label: 'URGENTE', dias: diasRestantes };
                if (diasRestantes <= 30) return { color: '#f97316', label: 'PRÓXIMO', dias: diasRestantes };
                if (diasRestantes <= 45) return { color: '#eab308', label: 'ATENCIÓN', dias: diasRestantes };
                return { color: '#10b981', label: 'TRANQUILO', dias: diasRestantes };
            };

            const cdtVencimientoBadge = (cdt) => {
                const diasFaltantes = Math.ceil((new Date(cdt.fechaVencimiento) - new Date()) / (1000 * 60 * 60 * 24));
                if (diasFaltantes <= 0) return <span className="badge danger">Vencido</span>;
                if (diasFaltantes <= 7) return <span className="badge warning">Vence en {diasFaltantes}d</span>;
                return <span className="badge">Vence en {diasFaltantes}d</span>;
            };

            const smmlvBadge = (principal) => {
                if (Number(principal) >= UMBRAL_SMMLV) {
                    return <span className="badge warning" title="Por encima del umbral de referencia SMMLV">Sobre umbral SMMLV</span>;
                }
                return null;
            };

            const calcularProgresoCdt = (fechaCreacion, fechaVencimiento) => {
                const inicio = new Date(fechaCreacion);
                const fin = new Date(fechaVencimiento);
                const hoy = new Date();
                const duracionTotal = fin - inicio;
                const transcurrido = hoy - inicio;
                const porcentaje = duracionTotal > 0 ? Math.min(100, Math.max(0, (transcurrido / duracionTotal) * 100)) : 100;
                const diasRestantes = Math.max(0, Math.ceil((fin - hoy) / (1000 * 60 * 60 * 24)));
                return { porcentaje, diasRestantes };
            };

            // Backup automático semanal
            useEffect(() => {
                const today = new Date().toISOString().slice(0, 10);
                const lastBackup = lastBackupDate || '';
                const daysSinceBackup = lastBackup ? Math.floor((new Date(today) - new Date(lastBackup)) / (1000 * 60 * 60 * 24)) : 999;
                
                if (daysSinceBackup >= 7) {
                    handleExport();
                    setLastBackupDate(today);
                }
            }, []);

            // Actualizar historial mensual
            useEffect(() => {
                const hoyMes = new Date().toISOString().slice(0, 7); // YYYY-MM
                const ultimoRegistro = historialMensual[historialMensual.length - 1];
                if (!ultimoRegistro || ultimoRegistro.mes !== hoyMes) {
                    const nuevoRegistro = {
                        mes: hoyMes,
                        liquido: totalSeccion1,
                        total: totalSeccion2
                    };
                    setHistorialMensual([...historialMensual, nuevoRegistro]);
                }
            }, [totalSeccion1, totalSeccion2]);

            return (
                <div className="container">
                    <div className="header">
                        <div className="header-actions" style={{ marginLeft: 'auto' }}>
                            <button className="btn-secondary icon-btn" onClick={handleExport} title="Exportar">🔽</button>
                            <button className="btn-secondary icon-btn" onClick={handleImportClick} title="Importar">🔼</button>
                            <input type="file" accept="application/json" ref={fileInputRef} onChange={handleImportFile} style={{ display: 'none' }} />
                            <button className="btn-secondary icon-btn" onClick={() => setHideAmounts(!hideAmounts)} title={hideAmounts ? 'Mostrar montos' : 'Ocultar montos'}>
                                {hideAmounts ? '👁️' : '👁️'}
                            </button>
                        </div>
                    </div>

                    <div className="tabs">
                        <button className={`tab ${tab === 'home' ? 'active' : ''}`} onClick={() => setTab('home')}>Home</button>
                        <button className={`tab ${tab === 'deudas' ? 'active' : ''}`} onClick={() => setTab('deudas')}>TC</button>
                        <button className={`tab ${tab === 'cuentas' ? 'active' : ''}`} onClick={() => setTab('cuentas')}>Cuentas</button>
                        <button className={`tab ${tab === 'cdts' ? 'active' : ''}`} onClick={() => setTab('cdts')}>CDTs</button>
                        <button className={`tab ${tab === 'fondos' ? 'active' : ''}`} onClick={() => setTab('fondos')}>Otros</button>
                    </div>

                    {tab === 'home' && (
                        <div>
                            {/* SECCIÓN AGREGAR GASTO - BOTÓN GRANDE */}
                            <div className="card" style={{ marginBottom: '1rem', padding: '2rem 1.5rem', textAlign: 'center' }}>
                                <div style={{ marginBottom: '1rem' }}>
                                    <p style={{ color: '#94a3b8', marginBottom: '1.5rem', fontSize: '0.95rem' }}>Registra un gasto del día</p>
                                    <button onClick={() => { setGastoForm(getEmptyGastoForm()); setEditingGastoId(null); setShowGastoModal(true); }} 
                                        style={{ width: '100%', padding: '1.2rem', fontSize: '1.1rem', fontWeight: '600', background: '#10b981', color: '#fff', border: 'none', borderRadius: '0.75rem', cursor: 'pointer', marginBottom: '1rem' }}>
                                        + Agregar Gasto
                                    </button>
                                </div>
                            </div>

                            {/* SECCIÓN RESUMEN HOYESTE MES + RECIENTES */}
                            <div className="card" style={{ marginBottom: '1rem', padding: '0', overflow: 'hidden' }}>
                                {/* RESUMEN HOYESTE MES */}
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0, borderTop: '2px solid #334155' }}>
                                    <div style={{ padding: '1.25rem', textAlign: 'center', borderRight: '1px solid #334155' }}>
                                        <div style={{ fontSize: '0.75rem', color: '#94a3b8', marginBottom: '0.5rem', fontWeight: '500' }}>Hoy</div>
                                        <div style={{ fontSize: '1.5rem', fontWeight: '700', color: '#10b981' }}>
                                            {formatCurrency(totalGastadoHoy)}
                                        </div>
                                    </div>
                                    <div style={{ padding: '1.25rem', textAlign: 'center' }}>
                                        <div style={{ fontSize: '0.75rem', color: '#94a3b8', marginBottom: '0.5rem', fontWeight: '500' }}>Este Mes</div>
                                        <div style={{ fontSize: '1.5rem', fontWeight: '700', color: '#06b6d4' }}>
                                            {formatCurrency(totalGastadoMes)}
                                        </div>
                                    </div>
                                </div>

                                {/* RECIENTES */}
                                <div style={{ padding: '1.5rem', borderTop: '1px solid #334155' }}>
                                    <h3 style={{ marginTop: 0, marginBottom: '1rem', fontSize: '1.1rem' }}>Recientes</h3>
                                    <input type="text" placeholder="🔍 Buscar gasto..." value={searchGasto}
                                        onChange={(e) => setSearchGasto(e.target.value)}
                                        style={{ width: '100%', padding: '0.7rem', marginBottom: '1rem', background: '#1e293b', color: '#e2e8f0', border: '1px solid #475569', borderRadius: '0.75rem', fontSize: '0.9rem' }} />
                                    {gastosOrdenados.length === 0 ? (
                                        <div className="empty" style={{ fontSize: '0.9rem' }}>Sin gastos aún</div>
                                    ) : (
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', maxHeight: '400px', overflowY: 'auto', paddingRight: '0.5rem' }}>
                                            {gastosOrdenados.filter(g => g.descripcion.toLowerCase().includes(searchGasto.toLowerCase()) || (g.categoria && g.categoria.toLowerCase().includes(searchGasto.toLowerCase()))).slice(0, 20).map((g) => (
                                                <div key={g.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.6rem 0', borderBottom: '1px solid #1e293b' }}>
                                                    <div style={{ flex: 1, minWidth: 0 }}>
                                                        <div style={{ fontSize: '0.9rem', fontWeight: '600', color: '#e2e8f0' }}>
                                                            {g.descripcion}
                                                        </div>
                                                        <div style={{ fontSize: '0.7rem', color: '#64748b', marginTop: '0.2rem' }}>
                                                            {formatDate(g.fecha)} • {g.metodo === 'tarjeta' ? g.tarjeta : (g.metodo === 'efectivo' ? 'Efectivo' : 'Cuenta')} {g.categoria ? `• ${g.categoria}` : ''}
                                                        </div>
                                                    </div>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.3rem', marginLeft: '0.75rem', flexShrink: 0 }}>
                                                        <span style={{ fontSize: '0.85rem', fontWeight: '700', color: '#10b981', minWidth: '70px', textAlign: 'right' }}>
                                                            {formatCurrency(Number(g.monto))}
                                                        </span>
                                                        <button onClick={() => handleEditGasto(g)} style={{ padding: '0.3rem 0.4rem', fontSize: '0.65rem', minWidth: '40px', background: '#3b82f6', color: '#fff', border: 'none', borderRadius: '0.4rem', cursor: 'pointer' }}>✎</button>
                                                        <button onClick={() => handleDeleteGasto(g.id)} style={{ padding: '0.3rem 0.4rem', fontSize: '0.65rem', minWidth: '40px', background: '#ef4444', color: '#fff', border: 'none', borderRadius: '0.4rem', cursor: 'pointer' }}>✕</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* SECCIÓN LÍQUIDO + TOTAL - COMPACTA */}
                            <div className="card" style={{ marginBottom: '1.5rem', padding: '1rem' }}>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                                    {/* Líquido */}
                                    <div style={{ background: 'rgba(59, 130, 246, 0.1)', borderLeft: '3px solid #3b82f6', padding: '0.75rem', borderRadius: '0.5rem' }}>

                                </div>
                                <div>
                                    <label className="field-label">Fecha de Vencimiento</label>
                                    <input type="date" value={cdtForm.fechaVencimiento}
                                        onChange={(e) => setCdtForm({ ...cdtForm, fechaVencimiento: e.target.value })} />
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.75rem', background: '#0f172a', borderRadius: '0.5rem' }}>
                                    <input type="checkbox" id="gmf-check" checked={cdtForm.aplicaGmf} onChange={(e) => setCdtForm({ ...cdtForm, aplicaGmf: e.target.checked })} />
                                    <label htmlFor="gmf-check" style={{ fontSize: '0.9rem', color: '#94a3b8', cursor: 'pointer', flex: 1, margin: 0 }}>
                                        ¿Se cobró GMF (4×1000)?
                                    </label>
                                </div>
                            </div>
                            <div className="button-group" style={{ marginTop: '2rem' }}>
                                <button onClick={() => { setShowCdtModal(false); setEditingCdtId(null); setCdtForm(emptyCdtForm); }} style={{ background: '#475569', flex: 1 }}>Cancelar</button>
                                <button onClick={handleSaveCdt} style={{ flex: 1 }}>{editingCdtId ? 'Actualizar' : 'Añadir'}</button>
                            </div>
                        </div>
                    </div>

                    {/* MODAL CUENTA DE AHORRO */}
                    <div className={`modal ${showCuentaModal ? 'active' : ''}`} onClick={() => { setShowCuentaModal(false); setEditingCuentaId(null); setCuentaForm(emptyCuentaForm); }}>
                        <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                            <h3>{editingCuentaId ? 'Editar Cuenta' : 'Nueva Cuenta de Ahorro'}</h3>
                            <div style={{ display: 'grid', gap: '1rem' }}>
                                <input type="text" placeholder="Nombre (ej: Nu principal)" value={cuentaForm.nombre}
                                    onChange={(e) => setCuentaForm({ ...cuentaForm, nombre: e.target.value })} />
                                <div>
                                    <label className="field-label">Plataforma / Entidad</label>
                                    <select value={cuentaForm.plataforma} onChange={(e) => setCuentaForm({ ...cuentaForm, plataforma: e.target.value, customBanco: '' })}>
                                        {BANCOS.map(b => <option key={b} value={b}>{b}</option>)}
                                    </select>
                                </div>
                                {cuentaForm.plataforma === 'Otro' && (
                                    <input type="text" placeholder="Nombre del banco" value={cuentaForm.customBanco}
                                        onChange={(e) => setCuentaForm({ ...cuentaForm, customBanco: e.target.value })} />
                                )}
                                <div>
                                    <label className="field-label">Tipo</label>
                                    <select value={cuentaForm.tipo} onChange={(e) => setCuentaForm({ ...cuentaForm, tipo: e.target.value })}>
                                        <option value="Ahorro">Cuenta de Ahorro</option>
                                        <option value="Corriente">Cuenta Corriente</option>
                                        <option value="Billetera">Billetera digital</option>
                                    </select>
                                </div>
                                <input type="number" placeholder="Saldo Actual" value={cuentaForm.saldo}
                                    onChange={(e) => setCuentaForm({ ...cuentaForm, saldo: e.target.value })} />
                                <div>
                                    <label className="field-label">Tasa de Rendimiento Efectivo Anual (E.A. %)</label>
                                    <input type="number" placeholder="Ej: 11.5" step="0.01" value={cuentaForm.tasa}
                                        onChange={(e) => setCuentaForm({ ...cuentaForm, tasa: e.target.value })} />
                                </div>
                            </div>
                            <div className="button-group" style={{ marginTop: '2rem' }}>
                                <button onClick={() => { setShowCuentaModal(false); setEditingCuentaId(null); setCuentaForm(emptyCuentaForm); }} style={{ background: '#475569', flex: 1 }}>Cancelar</button>
                                <button onClick={handleSaveCuenta} style={{ flex: 1 }}>{editingCuentaId ? 'Actualizar' : 'Añadir'}</button>
                            </div>
                        </div>
                    </div>

                    {/* MODAL DEUDA TC */}
                    <div className={`modal ${showDeudaModal ? 'active' : ''}`} onClick={() => { setShowDeudaModal(false); setEditingDeudaId(null); setDeudaForm(emptyDeudaForm); }}>
                        <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                            <h3>{editingDeudaId ? 'Editar Compra' : 'Nueva Compra a Crédito'}</h3>
                            <div style={{ display: 'grid', gap: '1rem' }}>
                                <input type="text" placeholder="Nombre (ej: Portátil MercadoLibre)" value={deudaForm.nombre}
                                    onChange={(e) => setDeudaForm({ ...deudaForm, nombre: e.target.value })} />
                                <div>
                                    <label className="field-label">Tarjeta</label>
                                    <select value={deudaForm.tarjeta} onChange={(e) => setDeudaForm({ ...deudaForm, tarjeta: e.target.value })}>
                                        {tarjetas.length > 0 ? (
                                            tarjetas.map(t => <option key={t.id} value={t.nombre}>{t.nombre}</option>)
                                        ) : (
                                            PLATAFORMAS.map(p => <option key={p} value={p}>{p}</option>)
                                        )}
                                    </select>
                                </div>
                                <input type="number" placeholder="Monto Total de la Compra" value={deudaForm.montoTotal}
                                    onChange={(e) => setDeudaForm({ ...deudaForm, montoTotal: e.target.value })} />
                                <div>
                                    <label className="field-label">Cuotas Totales (1 = una sola cuota)</label>
                                    <input type="number" min="1" value={deudaForm.cuotasTotales}
                                        onChange={(e) => setDeudaForm({ ...deudaForm, cuotasTotales: e.target.value })} />
                                </div>
                                <div>
                                    <label className="field-label">Cuotas Ya Pagadas</label>
                                    <input type="number" min="0" value={deudaForm.cuotasPagadas}
                                        onChange={(e) => setDeudaForm({ ...deudaForm, cuotasPagadas: e.target.value })} />
                                </div>
                                <div>
                                    <label className="field-label">Fecha de Compra</label>
                                    <input type="date" value={deudaForm.fechaCompra}
                                        onChange={(e) => setDeudaForm({ ...deudaForm, fechaCompra: e.target.value })} />
                                </div>
                            </div>
                            <div className="button-group" style={{ marginTop: '2rem' }}>
                                <button onClick={() => { setShowDeudaModal(false); setEditingDeudaId(null); setDeudaForm(emptyDeudaForm); }} style={{ background: '#475569', flex: 1 }}>Cancelar</button>
                                <button onClick={handleSaveDeuda} style={{ flex: 1 }}>{editingDeudaId ? 'Actualizar' : 'Añadir'}</button>
                            </div>
                        </div>
                    </div>

                    {/* MODAL OTRO ACTIVO */}
                    <div className={`modal ${showOtroModal ? 'active' : ''}`} onClick={() => { setShowOtroModal(false); setEditingOtroId(null); setOtroForm(emptyOtroForm); }}>
                        <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                            <h3>{editingOtroId ? 'Editar Activo' : 'Nuevo Activo'}</h3>
                            <div style={{ display: 'grid', gap: '1rem' }}>
                                <input type="text" placeholder="Nombre (ej: Ahorro en dólares, Acciones Ecopetrol)" value={otroForm.nombre}
                                    onChange={(e) => setOtroForm({ ...otroForm, nombre: e.target.value })} />
                                <div>
                                    <label className="field-label">Tipo</label>
                                    <input type="text" placeholder="Ej: Dólares, Efectivo, Colección, Acciones, Otro" value={otroForm.tipo}
                                        onChange={(e) => setOtroForm({ ...otroForm, tipo: e.target.value })} />
                                </div>
                                <div>
                                    <label className="field-label">Moneda</label>
                                    <select value={otroForm.moneda} onChange={(e) => setOtroForm({ ...otroForm, moneda: e.target.value })}>
                                        <option value="COP">COP</option>
                                        <option value="USD">USD</option>
                                    </select>
                                </div>
                                <input type="number" placeholder="Monto" value={otroForm.monto}
                                    onChange={(e) => setOtroForm({ ...otroForm, monto: e.target.value })} />
                                <div>
                                    <label className="field-label" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <input type="checkbox" style={{ width: 'auto' }} checked={otroForm.tieneRentabilidad}
                                            onChange={(e) => setOtroForm({ ...otroForm, tieneRentabilidad: e.target.checked })} />
                                        ¿Tiene rentabilidad?
                                    </label>
                                </div>
                                {otroForm.tieneRentabilidad && (
                                    <div>
                                        <label className="field-label">Tasa Efectiva Anual (%)</label>
                                        <input type="number" step="0.01" placeholder="Ej: 8.5" value={otroForm.tasa}
                                            onChange={(e) => setOtroForm({ ...otroForm, tasa: e.target.value })} />
                                    </div>
                                )}
                                <div>
                                    <label className="field-label">Vencimiento (opcional)</label>
                                    <input type="date" value={otroForm.vencimiento}
                                        onChange={(e) => setOtroForm({ ...otroForm, vencimiento: e.target.value })} />
                                </div>
                            </div>
                            <div className="button-group" style={{ marginTop: '2rem' }}>
                                <button onClick={() => { setShowOtroModal(false); setEditingOtroId(null); setOtroForm(emptyOtroForm); }} style={{ background: '#475569', flex: 1 }}>Cancelar</button>
                                <button onClick={handleSaveOtro} style={{ flex: 1 }}>{editingOtroId ? 'Actualizar' : 'Añadir'}</button>
                            </div>
                        </div>
                    </div>

                    {showGastoModal && (
                        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'flex-end', zIndex: 1000 }}>
                            <div style={{ width: '100%', maxHeight: '90vh', overflowY: 'auto', background: '#0f172a', borderRadius: '1rem 1rem 0 0', padding: '2rem 1.5rem' }}>
                                <h2 style={{ marginTop: 0, marginBottom: '1.5rem' }}>{editingGastoId ? 'Editar Gasto' : 'Nuevo Gasto'}</h2>
                                
                                <input type="text" placeholder="Descripción" value={gastoForm.descripcion}
                                    onChange={(e) => setGastoForm({ ...gastoForm, descripcion: e.target.value })}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: '#1e293b', color: '#e2e8f0', border: '1px solid #475569', borderRadius: '0.75rem', fontSize: '1rem' }} />
                                
                                <input type="number" placeholder="Monto" value={gastoForm.monto}
                                    onChange={(e) => setGastoForm({ ...gastoForm, monto: e.target.value })}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: '#1e293b', color: '#e2e8f0', border: '1px solid #475569', borderRadius: '0.75rem', fontSize: '1rem' }} />
                                
                                <input type="date" value={gastoForm.fecha}
                                    onChange={(e) => setGastoForm({ ...gastoForm, fecha: e.target.value })}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: '#1e293b', color: '#e2e8f0', border: '1px solid #475569', borderRadius: '0.75rem', fontSize: '1rem' }} />
                                
                                <select value={gastoForm.metodo} onChange={(e) => setGastoForm({ ...gastoForm, metodo: e.target.value })}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: '#1e293b', color: '#e2e8f0', border: '1px solid #475569', borderRadius: '0.75rem', fontSize: '1rem' }}>
                                    <option value="cuenta">Cuenta</option>
                                    <option value="tarjeta">Tarjeta de Crédito</option>
                                    <option value="efectivo">Efectivo</option>
                                </select>

                                <select value={gastoForm.categoria} onChange={(e) => setGastoForm({ ...gastoForm, categoria: e.target.value })}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: '#1e293b', color: '#e2e8f0', border: '1px solid #475569', borderRadius: '0.75rem', fontSize: '1rem' }}>
                                    {CATEGORIAS_GASTOS.map(cat => (
                                        <option key={cat} value={cat}>{cat}</option>
                                    ))}
                                </select>

                                {gastoForm.metodo === 'tarjeta' && (
                                    <select value={gastoForm.tarjeta} onChange={(e) => setGastoForm({ ...gastoForm, tarjeta: e.target.value })}
                                        style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: '#1e293b', color: '#e2e8f0', border: '1px solid #475569', borderRadius: '0.75rem', fontSize: '1rem' }}>
                                        {PLATAFORMAS.map(p => (
                                            <option key={p} value={p}>{p}</option>
                                        ))}
                                    </select>
                                )}

                                <div className="button-group" style={{ marginTop: '2rem' }}>
                                    <button onClick={() => { setShowGastoModal(false); setEditingGastoId(null); setGastoForm(getEmptyGastoForm()); }} style={{ background: '#475569', flex: 1 }}>Cancelar</button>
                                    <button onClick={editingGastoId ? handleUpdateGasto : handleSaveGasto} style={{ flex: 1 }}>{editingGastoId ? 'Actualizar' : 'Guardar'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <div className="toast">{toast}</div>}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(() => console.log('Service Worker registrado — la app ya funciona sin conexión'))
                    .catch((err) => console.error('Error registrando Service Worker:', err));
            });
        }
    </script>
</body>
</html>
