<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inversiones">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            /* Paleta de color unificada */
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #161f30;
            --border: #334155;
            --border-2: #475569;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --muted-2: #64748b;

            --success: #10b981;
            --success-dark: #059669;
            --success-light: #34d399;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --danger-critical: #8b0000;
            --info: #3b82f6;
            --purple: #a855f7;
            --expense: #f97316;
            --warning: #eab308;
            --cyan: #06b6d4;

            /* Escala tipográfica unificada */
            --fs-2xs: 0.7rem;
            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-base: 1rem;
            --fs-md: 1.25rem;
            --fs-lg: 1.5rem;
            --fs-xl: 1.75rem;
            --fs-2xl: 2.25rem;
            --fs-3xl: 3rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--surface) 100%);
            min-height: 100vh;
            padding: calc(3.75rem + env(safe-area-inset-top)) 1rem 2rem 1rem;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 5.5rem;
        }

        .footer-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            z-index: 900;
        }

        .footer-actions-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-actions-center {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-actions .icon-btn {
            width: 2.75rem;
            height: 2.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .footer-actions .fab-add {
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            background: linear-gradient(145deg, var(--success-light), var(--success-dark));
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(16, 185, 129, 0.45), inset 0 1px 1px rgba(255,255,255,0.25);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }

        .footer-actions .fab-add:active {
            transform: scale(0.9);
        }

        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .icon-btn {
            width: 2.75rem;
            height: 2.75rem;
            padding: 0;
            border-radius: 9999px;
            font-size: var(--fs-base);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h1 {
            font-size: var(--fs-2xl);
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--muted);
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: var(--border);
        }

        .btn-secondary:hover {
            background: var(--border-2);
        }

        .tabs {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
            padding: env(safe-area-inset-top) 1rem 0 1rem;
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3.75rem;
            z-index: 800;
            background: var(--bg);
        }

        .tabs .tab {
            flex: 1;
            text-align: center;
        }

        .tab {
            background: transparent;
            border: none;
            border-radius: 0.5rem 0.5rem 0 0;
            padding: 0.75rem 0.5rem;
            color: var(--muted);
            font-weight: 600;
            cursor: pointer;
            font-size: var(--fs-sm);
        }

        .tab:hover {
            background: var(--surface);
            color: #fff;
        }

        .tab.active {
            color: var(--success);
            border-bottom: 2px solid var(--success);
            background: transparent;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .gasto-cta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .gasto-cta:active {
            transform: scale(0.98);
            border-color: var(--success);
        }

        .gasto-cta-fab {
            flex-shrink: 0;
            width: 9rem;
            height: 9rem;
            border-radius: 9999px;
            background: linear-gradient(145deg, var(--success-light), var(--success-dark));
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.45), inset 0 1px 1px rgba(255,255,255,0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .gasto-cta:active .gasto-cta-fab {
            transform: scale(0.92);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.5), inset 0 1px 1px rgba(255,255,255,0.25);
        }

        .card h2 {
            font-size: var(--fs-md);
            margin-bottom: 1rem;
        }

        .stat-box {
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .stat-box p {
            color: #d1fae5;
            font-size: var(--fs-sm);
            margin-bottom: 0.5rem;
        }

        .stat-box .amount {
            font-size: var(--fs-xl);
            font-weight: bold;
            color: #fff;
        }

        .stat-box.blue {
            background: linear-gradient(135deg, var(--info) 0%, #1d4ed8 100%);
        }

        .stat-box.blue p {
            color: #dbeafe;
        }

        .stat-box.purple {
            background: linear-gradient(135deg, var(--purple) 0%, #7e22ce 100%);
        }

        .stat-box.purple p {
            color: #f3e8ff;
        }

        .stat-box.slate {
            background: linear-gradient(135deg, var(--muted-2) 0%, var(--border) 100%);
        }

        .stat-box.slate p {
            color: var(--text);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .mini-stat {
            /* Sub-cards informativas: oscuras */
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
        }

        .mini-stat.compact {
            padding: 0.6rem 0.5rem;
            min-height: 76px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .mini-stat.compact input {
            margin: 0.25rem 0 0 !important;
            width: 100%;
            height: 30px;
            box-sizing: border-box;
            padding: 0.25rem 0.5rem;
            font-size: var(--fs-sm);
            line-height: 1;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 0.5rem;
        }

        .mini-stat.compact p {
            font-size: var(--fs-2xs);
            margin-bottom: 0.25rem;
        }

        .mini-stat.compact .value {
            font-size: var(--fs-sm);
        }

        /* Acentos de datos: mismo diseño, color solo en la información */
        .stat-initial .value { color: #fff; }
        .stat-acumulado .value { color: var(--success-light); }
        .stat-tasa .value { color: #fb923c; }
        .stat-total .value { color: var(--success-light); }
        .stat-usd .value { color: #60a5fa; }
        .stat-cop .value { color: var(--success-light); }
        .stat-trm input { border-color: rgba(251, 146, 60, 0.45); }
        .stat-trm p { color: #fb923c; }
        .stat-total-cop .value { color: var(--success-light); }

        .otros-item .item-name { color: #e5e7eb; }
        .otros-item .item-meta { color: #94a3b8; }
        .otros-item .value.primary { color: #60a5fa; }

        .grid-compact {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem;
        }

        .mini-stat p {
            color: var(--muted);
            font-size: var(--fs-xs);
            margin-bottom: 0.5rem;
        }

        .mini-stat .value {
            font-weight: bold;
            font-size: var(--fs-base);
        }

        .update-section {
            margin-bottom: 2rem;
        }

        .update-section h3 {
            font-size: var(--fs-base);
            margin-bottom: 0.25rem;
        }

        .update-section .hint {
            color: var(--muted);
            font-size: var(--fs-xs);
            margin-bottom: 1rem;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        label.field-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--muted);
            font-size: var(--fs-sm);
        }

        input, select {
            background: var(--border);
            border: 1px solid var(--border-2);
            border-radius: 0.5rem;
            padding: 0.75rem;
            color: #fff;
            font-size: var(--fs-base);
            width: 100%;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--success);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1);
        }

        .item-list {
            max-height: 480px;
            overflow-y: auto;
        }

        .item-row {
            /* Ítems: mismo tono que las subcards informativas */
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
            display: grid;
            gap: 1rem;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .cuenta-item {
            padding: 0.8rem 0.9rem;
            margin-bottom: 0.65rem;
            gap: 0.65rem;
            grid-template-columns: minmax(0, 1fr);
        }

        .cuenta-item .item-header {
            align-items: center;
            margin-bottom: -0.1rem;
        }

        .cuenta-item .item-name {
            margin-bottom: 0.15rem;
        }

        .cuenta-item .item-data {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.65rem;
        }

        .cuenta-item .item-data-item {
            min-width: 0;
        }

        .cuenta-item .item-data-item p {
            margin-bottom: 0.1rem;
        }

        .cuenta-item .item-data-item .value {
            font-size: var(--fs-sm);
        }

        .cuenta-item .item-meta {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cuenta-item > .item-header > div:first-child {
            min-width: 0;
        }

        .cuenta-item .item-header > div:last-child {
            flex-shrink: 0;
        }

        @media (min-width: 600px) {
            .cuenta-item {
                grid-template-columns: minmax(0, 1.35fr) minmax(180px, 1fr);
                align-items: center;
                column-gap: 1rem;
            }
            .cuenta-item .item-data {
                grid-template-columns: repeat(2, minmax(90px, 1fr));
                gap: 0.75rem;
            }
        }

        .item-name {
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .item-meta {
            color: var(--muted);
            font-size: var(--fs-sm);
        }

        .badge {
            background: #064e3b;
            color: #86efac;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: var(--fs-xs);
            font-weight: 500;
            white-space: nowrap;
        }

        .badge.warning {
            background: #451a03;
            color: #fdba74;
        }

        .badge.danger {
            background: #450a0a;
            color: #fca5a5;
        }

        .badge.muted {
            background: var(--surface);
            color: var(--muted);
        }

        .item-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            font-size: var(--fs-sm);
        }

        .item-data-item p {
            color: var(--muted);
            font-size: var(--fs-xs);
            margin-bottom: 0.25rem;
        }

        .item-data-item .value {
            font-weight: bold;
            font-size: var(--fs-base);
        }

        .progress-wrap {
            margin-top: 0.25rem;
        }

        .progress-wrap .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: var(--fs-xs);
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        .progress-track {
            background: var(--surface);
            border-radius: 9999px;
            height: 0.6rem;
            overflow: hidden;
            border: 1px solid var(--border-2);
        }

        .progress-fill {
            height: 100%;
            border-radius: 9999px;
            background: linear-gradient(90deg, var(--success), var(--info));
            transition: width 0.3s ease;
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, var(--expense), #f59e0b);
        }

        .progress-fill.danger {
            background: linear-gradient(90deg, var(--danger), var(--danger-dark));
        }

        /* ---- Registrar Gasto: estilo minimalista tipo Apple ---- */
        .expense-card {
            background: linear-gradient(160deg, var(--surface) 0%, #172033 100%);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .amount-input-wrap {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.25rem;
            margin-bottom: 1.75rem;
        }

        .amount-input-wrap .currency-symbol {
            font-size: var(--fs-xl);
            color: var(--muted-2);
            font-weight: 600;
        }

        .amount-input {
            background: transparent !important;
            border: none !important;
            text-align: center;
            font-size: var(--fs-3xl);
            font-weight: 700;
            width: auto;
            max-width: 260px;
            padding: 0 !important;
            color: #fff;
            -moz-appearance: textfield;
        }

        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .amount-input:focus {
            box-shadow: none !important;
        }

        .desc-input {
            background: var(--bg) !important;
            border: none !important;
            border-radius: 0.75rem !important;
            text-align: center;
            font-size: var(--fs-base);
            padding: 0.85rem !important;
            margin-bottom: 1.25rem;
        }

        .pill-row {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
            margin-bottom: 1rem;
            -webkit-overflow-scrolling: touch;
        }

        .pill {
            flex-shrink: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 9999px;
            padding: 0.55rem 1.1rem;
            font-size: var(--fs-sm);
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .pill:hover {
            border-color: var(--border-2);
        }

        .pill.active {
            background: var(--success);
            border-color: var(--success);
            color: #fff;
        }

        .pill.active.tarjeta-active {
            background: var(--expense);
            border-color: var(--expense);
        }

        .expense-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .date-chip {
            background: var(--bg) !important;
            border: 1px solid var(--border) !important;
            border-radius: 0.75rem !important;
            padding: 0.65rem 1rem !important;
            font-size: 0.85rem !important;
            width: auto !important;
            color: var(--muted) !important;
            flex-grow: 1;
        }

        .fab-add {
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            font-size: var(--fs-2xl);
            line-height: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
            flex-shrink: 0;
        }

        .expense-hint-tarjeta {
            text-align: center;
            margin-top: 0.75rem;
        }

        .smart-move-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed var(--success);
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            margin-top: 0.75rem;
        }

        .smart-move-box .smart-move-title {
            font-size: var(--fs-xs);
            color: #6ee7b7;
            font-weight: 600;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .smart-move-box .smart-move-amount {
            font-size: var(--fs-base);
            font-weight: 700;
            color: var(--success);
        }

        .smart-move-box .smart-move-detail {
            font-size: var(--fs-xs);
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .value.primary { color: var(--success); }
        .value.blue { color: var(--info); }
        .value.orange { color: var(--expense); }
        .value.purple { color: var(--purple); }

        button {
            background: var(--success);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--success-dark);
        }

        button.danger {
            background: var(--danger);
        }

        button.danger:hover {
            background: var(--danger-dark);
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 1.5rem;
            font-size: var(--fs-lg);
        }

        .empty {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
        }

        .section-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 2000;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: var(--fs-xl);
            }

            /* Ajuste de espaciado para pantallas pequeñas: unifica padding,
               controles y textos sin alterar la separación entre FPyC y Otros. */
            .card {
                padding: 1rem;
                border-radius: 0.65rem;
            }

            .section-title-row {
                margin-bottom: 0.85rem;
                gap: 0.5rem;
            }

            .card h2,
            .update-section h3 {
                font-size: var(--fs-base);

                const pagadas = Math.min(cuotas, Math.max(0, Number(cuotasPagadas) || 0));
                const valorCuota = Number(montoTotal) / cuotas;
                const saldoPendiente = Math.max(0, Number(montoTotal) - valorCuota * pagadas);
                const cuotasRestantes = cuotas - pagadas;
                return { valorCuota, saldoPendiente, cuotasRestantes };
            };

            // el dinero que no se paga de una vez (montoTotal - primera cuota) se invierte

            const calcularGananciaCuotas = (montoTotal, cuotasTotales, tasaAnual) => {

                const mesesAprovechados = cuotas - 1;

            // ---------- Totales ----------

            // Gastos diarios: totales de hoy y del mes en curso
            const gastosOrdenados = useMemo(() =>

            const hoyStr = getHoyStr();

            // Tasa de rendimiento promedio ponderada: CDTs + Cuentas de Alto Rendimiento (solo ítems con tasa registrada)
            // Tasa promedio ponderada (CDTs + Cuentas):
            // Suma (monto × tasa) de cada activo / Suma montos = tasa promedio real según cuánta plata gana a cada tasa
            const tasaPromedioPonderada = useMemo(() => {
                let sumaGananciaAnual = 0;

                cdts.forEach(c => {

                cuentas.forEach(c => {
                    const monto = Number(c.saldo || 0);

                    if (monto > 0 && c.tasa !== '' && c.tasa !== undefined && c.tasa !== null) {
                        sumaGananciaAnual += monto * tasa;
                        sumaMontos += monto;
                    }
                });
                return sumaMontos > 0 ? sumaGananciaAnual / sumaMontos : null;
            }, [cdts, cuentas]);

            // Tasa promedio ponderada solo de CDTs
            const tasaPromedioCdts = useMemo(() => {
                let sumaGananciaAnual = 0;
                let sumaMontos = 0;
                cdts.forEach(c => {
                    const monto = Number(c.principal || 0);
                    const tasa = Number(c.tasa || 0);
                    if (monto > 0 && c.tasa !== '' && c.tasa !== undefined) {
                        sumaGananciaAnual += monto * tasa;

            // Tasa promedio ponderada solo de cuentas (solo las que tienen tasa registrada)
            const tasaPromedioCuentas = useMemo(() => {
                let sumaGananciaAnual = 0;
                let sumaMontos = 0;
                cuentas.forEach(c => {
                    const monto = Number(c.saldo || 0);

                    if (monto > 0 && c.tasa !== '' && c.tasa !== undefined && c.tasa !== null) {
                        sumaGananciaAnual += monto * tasa;

                });
                return sumaMontos > 0 ? sumaGananciaAnual / sumaMontos : null;
            }, [cuentas]);

            // Rendimiento diario estimado: (CDTs + Cuentas, con montos actualizados) x tasa promedio ponderada / 365
            const rendimientoDiarioEstimado = useMemo(() => {
                if (tasaPromedioPonderada === null) return null;
                const baseActualizada = totalCdtsSaldo + totalCuentas;
                return (baseActualizada * (tasaPromedioPonderada / 100)) / 365;
            }, [tasaPromedioPonderada, totalCdtsSaldo, totalCuentas]);

            // Rentabilidad estimada acumulada por período (a la fecha), usando el rendimiento diario actual como base
            const hoyDateObj = new Date(hoyStr + 'T00:00:00');
            const diaDelMes = hoyDateObj.getDate();
            const diaDelAnio = Math.ceil((hoyDateObj - new Date(hoyDateObj.getFullYear(), 0, 0)) / 86400000);

            const rentabilidadHoy = rendimientoDiarioEstimado || 0;
            const rentabilidadSemana = (rendimientoDiarioEstimado || 0) * 7;
            const rentabilidadMes = (rendimientoDiarioEstimado || 0) * diaDelMes;
            const rentabilidadAnio = (rendimientoDiarioEstimado || 0) * diaDelAnio;

            const netoHoy = rentabilidadHoy - totalGastadoHoy;
            const netoSemana = rentabilidadSemana - totalGastadoSemana;
            const netoMes = rentabilidadMes - totalGastadoMes;
            const netoAnio = rentabilidadAnio - totalGastadoAnio;

            // Historial de rendimiento: registra un snapshot diario del Líquido (Sección 1: CDTs + Cuentas)
            // El Total (Sección 2) no se trackea a diario porque solo cambia cuando actualizas FPV/Pensión/Cesantías/Otros a mano;
            // su evolución real se mide mes a mes en historialMensual.
            useEffect(() => {
                const hoy = new Date().toISOString().slice(0, 10);
                setHistorial(prev => {
                    const nuevo = [...prev];
                    if (nuevo.length && nuevo[nuevo.length - 1].fecha === hoy) {
                        if (nuevo[nuevo.length - 1].total === totalSeccion1) return prev;
                        nuevo[nuevo.length - 1] = { fecha: hoy, total: totalSeccion1 };
                    } else {
                        nuevo.push({ fecha: hoy, total: totalSeccion1 });
                    }
                    return nuevo.slice(-3650); // ~10 años — guardamos tantos días como sea razonablemente posible
                });
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [totalSeccion1]);

            const historialOrdenado = useMemo(() =>
                [...historial].sort((a, b) => new Date(a.fecha) - new Date(b.fecha)),

            const variacionDiaria = useMemo(() => {
                if (historialOrdenado.length < 2) return null;
                const hoy = historialOrdenado[historialOrdenado.length - 1];
                const ayer = historialOrdenado[historialOrdenado.length - 2];
                const diferencia = hoy.total - ayer.total;
                const porcentaje = ayer.total !== 0 ? (diferencia / ayer.total) * 100 : 0;
                return { diferencia, porcentaje };
            }, [historialOrdenado]);

            const ultimos7Dias = useMemo(() => historialOrdenado.slice(-7), [historialOrdenado]);

            const variacion7Dias = useMemo(() => {
                if (ultimos7Dias.length < 2) return null;
                const primero = ultimos7Dias[0];
                const ultimo = ultimos7Dias[ultimos7Dias.length - 1];
                const diferencia = ultimo.total - primero.total;
                const porcentaje = primero.total !== 0 ? (diferencia / primero.total) * 100 : 0;
                return { diferencia, porcentaje };
            }, [ultimos7Dias]);

            const variacionMensual = useMemo(() => {
                if (historialMensual.length < 2) return null;
                const actual = historialMensual[historialMensual.length - 1];
                const anterior = historialMensual[historialMensual.length - 2];
                const diferenciaLiquido = actual.liquido - anterior.liquido;
                const porcentajeLiquido = anterior.liquido !== 0 ? (diferenciaLiquido / anterior.liquido) * 100 : 0;
                const diferenciaTotal = actual.total - anterior.total;
                const porcentajeTotal = anterior.total !== 0 ? (diferenciaTotal / anterior.total) * 100 : 0;
                return { diferenciaLiquido, porcentajeLiquido, diferenciaTotal, porcentajeTotal };

            const cdtsOrdenados = useMemo(() =>

            const formatCurrency = (num, moneda = 'COP') => {
                if (hideAmounts) return '••••••';

            };

            const formatDate = (date) => {
                if (!date) return '—';
                // Admite fechas simples (YYYY-MM-DD) y fechas ISO con hora.
                const fecha = String(date).slice(0, 10);
                const [year, month, day] = fecha.split('-');
                if (!year || !month || !day) return '—';
                return new Date(Number(year), Number(month) - 1, Number(day)).toLocaleDateString('es-CO');
            };

            const calcularVencimientoTC = (diaCorte, diasGracia) => {
                const hoy = new Date();
                const año = hoy.getFullYear();
                const mes = hoy.getMonth();
                
                // Crear fecha de corte de este mes
                let fechaCorte = new Date(año, mes, diaCorte);
                
                // Si el corte ya pasó, usar el próximo mes
                if (fechaCorte < hoy) {
                    fechaCorte = new Date(año, mes + 1, diaCorte);
                }
                
                // Agregar días de gracia
                let fechaVencimiento = new Date(fechaCorte);
                fechaVencimiento.setDate(fechaVencimiento.getDate() + diasGracia);
                
                // Ajustar si cae en fin de semana o festivo
                const festivos = [
                    new Date(año, 0, 1), // Año Nuevo
                    new Date(año, 4, 1), // Día del Trabajo
                    new Date(año, 6, 20), // Independencia
                    new Date(año, 7, 7), // Batalla de Boyacá
                    new Date(año, 11, 25), // Navidad
                ];
                
                while (fechaVencimiento.getDay() === 0 || fechaVencimiento.getDay() === 6 || 
                       festivos.some(f => f.toDateString() === fechaVencimiento.toDateString())) {
                    // Si es fin de semana o festivo, pasar al lunes siguiente
                    if (fechaVencimiento.getDay() === 0 || fechaVencimiento.getDay() === 6) {
                        const diasAlunes = (1 - fechaVencimiento.getDay() + 7) % 7 || 1;
                        fechaVencimiento.setDate(fechaVencimiento.getDate() + diasAlunes);
                    } else {
                        fechaVencimiento.setDate(fechaVencimiento.getDate() + 1);
                    }
                }
                
                const year = fechaVencimiento.getFullYear();
                const month = String(fechaVencimiento.getMonth() + 1).padStart(2, '0');
                const day = String(fechaVencimiento.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const calcularSemaforoTC = (fechaLimite) => {
                const hoy = new Date();
                const [year, month, day] = fechaLimite.split('-');
                const fecha = new Date(year, month - 1, day);
                const diasRestantes = Math.ceil((fecha - hoy) / (1000 * 60 * 60 * 24));
                
                if (diasRestantes <= 3) return { color: 'var(--danger-critical)', label: 'CRÍTICO', dias: diasRestantes };
                if (diasRestantes <= 15) return { color: 'var(--danger)', label: 'URGENTE', dias: diasRestantes };
                if (diasRestantes <= 30) return { color: 'var(--expense)', label: 'PRÓXIMO', dias: diasRestantes };
                if (diasRestantes <= 45) return { color: 'var(--warning)', label: 'ATENCIÓN', dias: diasRestantes };
                return { color: 'var(--success)', label: 'TRANQUILO', dias: diasRestantes };
            };

            // Devuelve la fecha límite de una tarjeta: la manual si el usuario la definió, si no la calculada automáticamente
            const obtenerVencimientoTC = (t) => {
                if (t.fechaLimiteManual) return t.fechaLimiteManual;
                return calcularVencimientoTC(t.diaCorte, t.diasGracia);

                const diasFaltantes = Math.ceil((new Date(cdt.fechaVencimiento) - new Date()) / (1000 * 60 * 60 * 24));

                if (diasFaltantes <= 7) return <span className="badge warning">Vence en {diasFaltantes}d</span>;
                return <span className="badge">Vence en {diasFaltantes}d</span>;

            const smmlvBadge = (principal) => {

                }

            const calcularProgresoCdt = (fechaCreacion, fechaVencimiento) => {
                const inicio = new Date(fechaCreacion);
                const fin = new Date(fechaVencimiento);
                const hoy = new Date();
                const duracionTotal = fin - inicio;
                const transcurrido = hoy - inicio;
                const porcentaje = duracionTotal > 0 ? Math.min(100, Math.max(0, (transcurrido / duracionTotal) * 100)) : 100;
                const diasRestantes = Math.max(0, Math.ceil((fin - hoy) / (1000 * 60 * 60 * 24)));
                return { porcentaje, diasRestantes };
            };

            // Backup automático semanal
            useEffect(() => {
                const today = new Date().toISOString().slice(0, 10);
                const lastBackup = lastBackupDate || '';
                const daysSinceBackup = lastBackup ? Math.floor((new Date(today) - new Date(lastBackup)) / (1000 * 60 * 60 * 24)) : 999;

            // Actualizar historial mensual

                const hoyMes = new Date().toISOString().slice(0, 7); // YYYY-MM
                const ultimoRegistro = historialMensual[historialMensual.length - 1];

                                {hideAmounts ? (

                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>

                    <div className="tabs">

                    {tab === 'home' && (

                                    // Promedios mensuales de los últimos 12 meses, por categoría
                                    const gastosUltimos12Meses = [];

                                        const primero = bloque[0];
                                        const ultimo = bloque[bloque.length - 1];
                                        const dIni = new Date(primero.fecha + 'T00:00:00');
                                        const dFin = new Date(ultimo.fecha + 'T00:00:00');

                                                        </tr>
                                                    </thead>

                                                                <td style={{ padding: '0.55rem 0.25rem', fontWeight: '700' }}>{r.fecha}</td>
                                                                <td style={{ padding: '0.55rem 0.25rem', textAlign: 'right', fontWeight: '600', color: 'var(--danger)' }}>
                                                                    {r.gastos > 0 ? `-${formatCurrency(r.gastos)}` : formatCurrency(0)}
                                                                </td>
                                                                <td style={{ padding: '0.55rem 0.25rem', textAlign: 'right', fontWeight: '600', color: 'var(--success)' }}>

                                    </select>
                                </div>
                                <input type="number" placeholder="Monto Inicial" value={cdtForm.principal}
                                    onChange={(e) => setCdtForm({ ...cdtForm, principal: e.target.value })} />
                                <input type="number" placeholder="Tasa Anual (%)" step="0.01" value={cdtForm.tasa}
                                    onChange={(e) => setCdtForm({ ...cdtForm, tasa: e.target.value })} />
                                <div>
                                    <label className="field-label">Fecha de Creación</label>
                                    <input type="date" value={cdtForm.fechaCreacion}
                                        onChange={(e) => setCdtForm({ ...cdtForm, fechaCreacion: e.target.value })} />
                                </div>
                                <div>
                                    <label className="field-label">Fecha de Vencimiento</label>
                                    <input type="date" value={cdtForm.fechaVencimiento}
                                        onChange={(e) => setCdtForm({ ...cdtForm, fechaVencimiento: e.target.value })} />
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.75rem', background: 'var(--bg)', borderRadius: '0.5rem' }}>
                                    <input type="checkbox" id="gmf-check" checked={cdtForm.aplicaGmf} onChange={(e) => setCdtForm({ ...cdtForm, aplicaGmf: e.target.checked })} />
                                    <label htmlFor="gmf-check" style={{ fontSize: 'var(--fs-sm)', color: 'var(--muted)', cursor: 'pointer', flex: 1, margin: 0 }}>
                                        ¿Se cobró GMF (4×1000)?
                                    </label>
                                </div>
                            </div>
                            <div className="button-group" style={{ marginTop: '2rem' }}>
                                <button onClick={() => { setShowCdtModal(false); setEditingCdtId(null); setCdtForm(emptyCdtForm); }} style={{ background: 'var(--border-2)', flex: 1 }}>Cancelar</button>
                                <button onClick={handleSaveCdt} style={{ flex: 1 }}>{editingCdtId ? 'Actualizar' : 'Añadir'}</button>
                            </div>
                        </div>
                    </div>

                    {/* MODAL CUENTA DE AHORRO */}
                    <div className={`modal ${showCuentaModal ? 'active' : ''}`} onClick={() => { setShowCuentaModal(false); setEditingCuentaId(null); setCuentaForm(emptyCuentaForm); }}>
                        <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                            <h3>{editingCuentaId ? 'Editar Cuenta' : 'Nueva Cuenta de Ahorro'}</h3>
                            <div style={{ display: 'grid', gap: '1rem' }}>
                                <input type="text" placeholder="Nombre (ej: Nu principal)" value={cuentaForm.nombre}
                                    onChange={(e) => setCuentaForm({ ...cuentaForm, nombre: e.target.value })} />
                                <div>
                                    <label className="field-label">Plataforma / Entidad</label>
                                    <select value={cuentaForm.plataforma} onChange={(e) => setCuentaForm({ ...cuentaForm, plataforma: e.target.value, customBanco: '' })}>
                                        {BANCOS.map(b => <option key={b} value={b}>{b}</option>)}
                                    </select>
                                </div>
                                {cuentaForm.plataforma === 'Otro' && (
                                    <input type="text" placeholder="Nombre del banco" value={cuentaForm.customBanco}
                                        onChange={(e) => setCuentaForm({ ...cuentaForm, customBanco: e.target.value })} />
                                )}
                                <div>
                                    <label className="field-label">Tipo</label>
                                    <select value={cuentaForm.tipo} onChange={(e) => setCuentaForm({ ...cuentaForm, tipo: e.target.value })}>
                                        <option value="Ahorro">Cuenta de Ahorro</option>
                                        <option value="Corriente">Cuenta Corriente</option>
                                        <option value="Billetera">Billetera digital</option>
                                    </select>
                                </div>
                                <input type="number" placeholder="Saldo Actual" value={cuentaForm.saldo}
                                    onChange={(e) => setCuentaForm({ ...cuentaForm, saldo: e.target.value })} />
                                <div>
                                    <label className="field-label">Tasa de Rendimiento Efectivo Anual (E.A. %)</label>
                                    <input type="number" placeholder="Ej: 11.5" step="0.01" value={cuentaForm.tasa}
                                        onChange={(e) => setCuentaForm({ ...cuentaForm, tasa: e.target.value })} />
                                </div>
                            </div>
                            <div className="button-group" style={{ marginTop: '2rem' }}>
                                <button onClick={() => { setShowCuentaModal(false); setEditingCuentaId(null); setCuentaForm(emptyCuentaForm); }} style={{ background: 'var(--border-2)', flex: 1 }}>Cancelar</button>
                                <button onClick={handleSaveCuenta} style={{ flex: 1 }}>{editingCuentaId ? 'Actualizar' : 'Añadir'}</button>
                            </div>
                        </div>
                    </div>

                    {/* MODAL DEUDA TC */}
                    <div className={`modal ${showDeudaModal ? 'active' : ''}`} onClick={() => { setShowDeudaModal(false); setEditingDeudaId(null); setDeudaForm(emptyDeudaForm); }}>
                        <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                            <h3>{editingDeudaId ? 'Editar Compra' : 'Nueva Compra a Crédito'}</h3>
                            <div style={{ display: 'grid', gap: '1rem' }}>
                                <input type="text" placeholder="Nombre (ej: Portátil MercadoLibre)" value={deudaForm.nombre}
                                    onChange={(e) => setDeudaForm({ ...deudaForm, nombre: e.target.value })} />
                                <div>
                                    <label className="field-label">Tarjeta</label>
                                    <select value={deudaForm.tarjeta} onChange={(e) => setDeudaForm({ ...deudaForm, tarjeta: e.target.value })}>
                                        {tarjetas.length > 0 ? (
                                            tarjetas.map(t => <option key={t.id} value={t.nombre}>{t.nombre}</option>)
                                        ) : (
                                            PLATAFORMAS.map(p => <option key={p} value={p}>{p}</option>)
                                        )}
                                    </select>
                                </div>
                                <input type="number" placeholder="Monto Total de la Compra" value={deudaForm.montoTotal}
                                    onChange={(e) => setDeudaForm({ ...deudaForm, montoTotal: e.target.value })} />
                                <div>
                                    <label className="field-label">Cuotas Totales (1 = una sola cuota)</label>
                                    <input type="number" min="1" value={deudaForm.cuotasTotales}
                                        onChange={(e) => setDeudaForm({ ...deudaForm, cuotasTotales: e.target.value })} />
                                </div>
                                <div>
                                    <label className="field-label">Cuotas Ya Pagadas</label>
                                    <input type="number" min="0" value={deudaForm.cuotasPagadas}
                                        onChange={(e) => setDeudaForm({ ...deudaForm, cuotasPagadas: e.target.value })} />
                                </div>
                                <div>
                                    <label className="field-label">Fecha de Compra</label>
                                    <input type="date" value={deudaForm.fechaCompra}
                                        onChange={(e) => setDeudaForm({ ...deudaForm, fechaCompra: e.target.value })} />
                                </div>
                            </div>
                            <div className="button-group" style={{ marginTop: '2rem' }}>
                                <button onClick={() => { setShowDeudaModal(false); setEditingDeudaId(null); setDeudaForm(emptyDeudaForm); }} style={{ background: 'var(--border-2)', flex: 1 }}>Cancelar</button>
                                <button onClick={handleSaveDeuda} style={{ flex: 1 }}>{editingDeudaId ? 'Actualizar' : 'Añadir'}</button>
                            </div>
                        </div>
                    </div>

                    {/* MODAL OTRO ACTIVO */}
                    <div className={`modal ${showOtroModal ? 'active' : ''}`} onClick={() => { setShowOtroModal(false); setEditingOtroId(null); setOtroForm(emptyOtroForm); }}>
                        <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                            <h3>{editingOtroId ? 'Editar Activo' : 'Nuevo Activo'}</h3>
                            <div style={{ display: 'grid', gap: '1rem' }}>
                                <input type="text" placeholder="Nombre (ej: Ahorro en dólares, Acciones Ecopetrol)" value={otroForm.nombre}
                                    onChange={(e) => setOtroForm({ ...otroForm, nombre: e.target.value })} />
                                <div>
                                    <label className="field-label">Tipo</label>
                                    <input type="text" placeholder="Ej: Dólares, Efectivo, Colección, Acciones, Otro" value={otroForm.tipo}
                                        onChange={(e) => setOtroForm({ ...otroForm, tipo: e.target.value })} />
                                </div>
                                <div>
                                    <label className="field-label">Moneda</label>
                                    <select value={otroForm.moneda} onChange={(e) => setOtroForm({ ...otroForm, moneda: e.target.value })}>
                                        <option value="COP">COP</option>
                                        <option value="USD">USD</option>
                                    </select>
                                </div>
                                <input type="number" placeholder="Monto" value={otroForm.monto}
                                    onChange={(e) => setOtroForm({ ...otroForm, monto: e.target.value })} />
                                <div>
                                    <label className="field-label" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <input type="checkbox" style={{ width: 'auto' }} checked={otroForm.tieneRentabilidad}
                                            onChange={(e) => setOtroForm({ ...otroForm, tieneRentabilidad: e.target.checked })} />
                                        ¿Tiene rentabilidad?
                                    </label>
                                </div>
                                {otroForm.tieneRentabilidad && (
                                    <div>
                                        <label className="field-label">Tasa Efectiva Anual (%)</label>
                                        <input type="number" step="0.01" placeholder="Ej: 8.5" value={otroForm.tasa}
                                            onChange={(e) => setOtroForm({ ...otroForm, tasa: e.target.value })} />
                                    </div>
                                )}
                                <div>
                                    <label className="field-label">Vencimiento (opcional)</label>
                                    <input type="date" value={otroForm.vencimiento}
                                        onChange={(e) => setOtroForm({ ...otroForm, vencimiento: e.target.value })} />
                                </div>
                            </div>
                            <div className="button-group" style={{ marginTop: '2rem' }}>
                                <button onClick={() => { setShowOtroModal(false); setEditingOtroId(null); setOtroForm(emptyOtroForm); }} style={{ background: 'var(--border-2)', flex: 1 }}>Cancelar</button>
                                <button onClick={handleSaveOtro} style={{ flex: 1 }}>{editingOtroId ? 'Actualizar' : 'Añadir'}</button>
                            </div>
                        </div>
                    </div>

                    {showGastoModal && (
                        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'flex-end', zIndex: 1000 }}
                            onClick={() => { setShowGastoModal(false); setEditingGastoId(null); setGastoForm(getEmptyGastoForm()); setMostrandoNuevaCategoria(false); setNuevaCategoriaInput(''); }}>
                            <div style={{ width: '100%', maxHeight: '90vh', overflowY: 'auto', background: 'var(--bg)', borderRadius: '1rem 1rem 0 0', padding: '2rem 1.5rem' }}
                                onClick={(e) => e.stopPropagation()}>
                                <h2 style={{ marginTop: 0, marginBottom: '1.5rem' }}>{editingGastoId ? 'Editar Gasto' : 'Nuevo Gasto'}</h2>
                                
                                <input type="text" placeholder="Descripción" value={gastoForm.descripcion}
                                    onChange={(e) => setGastoForm({ ...gastoForm, descripcion: e.target.value })}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--border-2)', borderRadius: '0.75rem', fontSize: 'var(--fs-base)' }} />
                                
                                <input type="number" placeholder="Monto" value={gastoForm.monto}
                                    onChange={(e) => setGastoForm({ ...gastoForm, monto: e.target.value })}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--border-2)', borderRadius: '0.75rem', fontSize: 'var(--fs-base)' }} />
                                
                                <input type="date" value={gastoForm.fecha}
                                    onChange={(e) => setGastoForm({ ...gastoForm, fecha: e.target.value })}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--border-2)', borderRadius: '0.75rem', fontSize: 'var(--fs-base)' }} />
                                
                                <select value={gastoForm.metodo} onChange={(e) => setGastoForm({ ...gastoForm, metodo: e.target.value })}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--border-2)', borderRadius: '0.75rem', fontSize: 'var(--fs-base)' }}>
                                    <option value="cuenta">Cuenta</option>
                                    <option value="tarjeta">Tarjeta de Crédito</option>
                                    <option value="efectivo">Efectivo</option>
                                </select>

                                <select value={mostrandoNuevaCategoria ? '__nueva__' : gastoForm.categoria}
                                    onChange={(e) => {
                                        if (e.target.value === '__nueva__') {
                                            setMostrandoNuevaCategoria(true);
                                        } else {
                                            setMostrandoNuevaCategoria(false);
                                            setGastoForm({ ...gastoForm, categoria: e.target.value });
                                        }
                                    }}
                                    style={{ width: '100%', padding: '0.75rem', marginBottom: mostrandoNuevaCategoria ? '0.5rem' : '1rem', background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--border-2)', borderRadius: '0.75rem', fontSize: 'var(--fs-base)' }}>
                                    {categoriasGastos.map(cat => (
                                        <option key={cat} value={cat}>{cat}</option>
                                    ))}
                                    <option value="__nueva__">➕ Nueva categoría...</option>
                                </select>

                                {mostrandoNuevaCategoria && (
                                    <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem' }}>
                                        <input type="text" placeholder="Nombre de la categoría" value={nuevaCategoriaInput}
                                            autoFocus
                                            onChange={(e) => setNuevaCategoriaInput(e.target.value)}
                                            onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handleAgregarCategoria(); } }}
                                            style={{ flex: 1, padding: '0.75rem', background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--border-2)', borderRadius: '0.75rem', fontSize: 'var(--fs-base)' }} />
                                        <button onClick={handleAgregarCategoria} style={{ padding: '0 1.25rem' }}>Añadir</button>
                                    </div>
                                )}

                                {gastoForm.metodo === 'cuenta' ? (
                                    <select value={gastoForm.cuentaId} onChange={(e) => setGastoForm({ ...gastoForm, cuentaId: e.target.value })}
                                        style={{ width: '100%', padding: '0.75rem', marginBottom: '1rem', background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--border-2)', borderRadius: '0.75rem', fontSize: 'var(--fs-base)' }}>
                                        <option value="">Selecciona una cuenta...</option>
                                        {cuentas.map(c => (
                                            <option key={c.id} value={c.id}>{c.nombre} ({c.plataforma})</option>
                                        ))}
                                    </select>
                                ) : (
                                    <select value={gastoForm.metodo === 'tarjeta' ? gastoForm.tarjeta : ''}
                                        disabled={gastoForm.metodo !== 'tarjeta'}
                                        onChange={(e) => setGastoForm({ ...gastoForm, tarjeta: e.target.value })}
                                        style={{
                                            width: '100%', padding: '0.75rem', marginBottom: '1rem',
                                            background: gastoForm.metodo !== 'tarjeta' ? 'var(--surface-2)' : 'var(--surface)',
                                            color: gastoForm.metodo !== 'tarjeta' ? 'var(--border-2)' : 'var(--text)',
                                            border: '1px solid var(--border)', borderRadius: '0.75rem', fontSize: 'var(--fs-base)',
                                            cursor: gastoForm.metodo !== 'tarjeta' ? 'not-allowed' : 'pointer'
                                        }}>
                                        {gastoForm.metodo !== 'tarjeta' && <option value="">Tarjeta de crédito (no aplica)</option>}
                                        {PLATAFORMAS.map(p => (
                                            <option key={p} value={p}>{p}</option>
                                        ))}
                                    </select>
                                )}

                                <div className="button-group" style={{ marginTop: '2rem' }}>
                                    <button onClick={() => { setShowGastoModal(false); setEditingGastoId(null); setGastoForm(getEmptyGastoForm()); setMostrandoNuevaCategoria(false); setNuevaCategoriaInput(''); }} style={{ background: 'var(--border-2)', flex: 1 }}>Cancelar</button>
                                    <button onClick={editingGastoId ? handleUpdateGasto : handleSaveGasto} style={{ flex: 1 }}>{editingGastoId ? 'Actualizar' : 'Guardar'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <div className="toast">{toast}</div>}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(() => console.log('Service Worker registrado — la app ya funciona sin conexión'))
                    .catch((err) => console.error('Error registrando Service Worker:', err));
            });
        }
    </script>
</body>
</html>
